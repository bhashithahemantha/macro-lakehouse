resources:
  schemas:
    macro_lakehouse:
      catalog_name: ${var.catalog}
      name: ${var.schema_name}
      comment: US Treasury yield curve lakehouse

  volumes:
    landing:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.macro_lakehouse.name}
